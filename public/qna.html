    let selectedCategory = '全部'
    let searchQuery = ''
    let expandedQna = null

    const categories = ['全部', ...new Set(qnaDatabase.map(q => q.category))]

    function getCategoryColor(category) {
      const colors = {
        '中医辨证': '#ef4444',
        '舌诊': '#f59e0b',
        '中西医结合': '#10b981',
        '方剂学': '#8b5cf6',
        '中药学': '#ec4899',
      }
      return colors[category] || '#6b7280'
    }

    function renderFilters() {
      const filtersEl = document.getElementById('filters')
      filtersEl.innerHTML = categories.map(cat => 
        `<button class="filter-btn ${cat === selectedCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>`
      ).join('')
    }

    function setCategory(category) {
      selectedCategory = category
      renderFilters()
      renderQna()
    }

    function renderQna() {
      let result = qnaDatabase
      if (selectedCategory !== '全部') {
        result = result.filter(q => q.category === selectedCategory)
      }
      if (searchQuery.trim()) {
        const query = searchQuery.toLowerCase()
        result = result.filter(q =>
          q.question.toLowerCase().includes(query) ||
          q.answer.toLowerCase().includes(query) ||
          q.tags.some(tag => tag.toLowerCase().includes(query))
        )
      }

      document.getElementById('results-count').textContent = `找到 ${result.length} 个问答`
      
      const gridEl = document.getElementById('qna-grid')
      if (result.length === 0) {
        gridEl.innerHTML = '<div class="empty-state"><div style="font-size: 48px; margin-bottom: 16px;">🔍</div><div>没有找到相关问答</div></div>'
        return
      }

      gridEl.innerHTML = result.map(qna => {
        const color = getCategoryColor(qna.category)
        return `
          <div class="qna-card" onclick="openModal('${qna.id}')">
            <span class="category-tag" style="background: ${color}15; color: ${color}">${qna.category}</span>
            <div class="qna-question">${qna.question}</div>
            <div class="tags">
              ${qna.tags.slice(0, 3).map(tag => `<span class="tag">#${tag}</span>`).join('')}
              ${qna.tags.length > 3 ? `<span class="tag">+${qna.tags.length - 3}</span>` : ''}
            </div>
          </div>
        `
      }).join('')

      // Update stats
      document.getElementById('total-count').textContent = qnaDatabase.length
      document.getElementById('today-count').textContent = qnaDatabase.length
      document.getElementById('category-count').textContent = categories.length - 1
    }

    function openModal(id) {
      const qna = qnaDatabase.find(q => q.id === id)
      if (!qna) return

      const color = getCategoryColor(qna.category)
      document.getElementById('modal-category').textContent = qna.category
      document.getElementById('modal-category').style.background = `${color}15`
      document.getElementById('modal-category').style.color = color
      document.getElementById('modal-question').textContent = qna.question
      document.getElementById('modal-timestamp').textContent = qna.timestamp
      document.getElementById('modal-answer').innerHTML = qna.answer

      const relatedEl = document.getElementById('modal-related')
      if (qna.relatedTopics && qna.relatedTopics.length > 0) {
        relatedEl.innerHTML = '<h3 style="font-size: 16px; font-weight: 600; margin-bottom: 12px;">相关问题</h3>' +
          qna.relatedTopics.map(topic => `<span class="related-tag">💡 ${topic}</span>`).join('')
        relatedEl.style.display = 'block'
      } else {
        relatedEl.style.display = 'none'
      }

      document.getElementById('modal').style.display = 'flex'
      document.body.style.overflow = 'hidden'
    }

    function closeModal(event) {
      if (event.target === document.getElementById('modal')) {
        closeModalDirect()
      }
    }

    function closeModalDirect() {
      document.getElementById('modal').style.display = 'none'
      document.body.style.overflow = 'auto'
    }

    // Search functionality
    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value
      renderQna()
    })

    // Initialize
    renderFilters()
    renderQna()
  </script>
